<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🦕 공룡 에이트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green:  #3d6b52;
      --green2: #4e8466;
      --accent: #6aaa84;
      --egg:    #f5e97a;
      --bg:     #f5f7f3;
      --cream:  #faf9f5;
      --white:  #ffffff;
      --text:   #2d3a30;
      --muted:  #7a9080;
      --border: #dde8e1;
      --t-bang:  #f59e0b;
      --t-q:     #3b82f6;
      --t-quote: #8b5cf6;
      --t-apply: #ec4899;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 화면 ─────────────────────────────── */
    .screen { display: none; min-height: 100vh; padding-bottom: 76px; }
    .screen.on { display: block; }

    /* ── 탑바 ─────────────────────────────── */
    .topbar {
      position: sticky; top: 0; background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 13px 18px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 50;
    }
    .topbar-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px; font-weight: 700; color: var(--green);
    }

    /* ── 하단 네비 ────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--white); border-top: 1px solid var(--border);
      display: flex; z-index: 100;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 10px 4px 8px;
      border: none; background: none; cursor: pointer;
      font-family: inherit; gap: 3px; color: var(--muted); transition: color .15s;
    }
    .nav-item.active { color: var(--green); }
    .nav-item .ni { font-size: 20px; }
    .nav-item .nl { font-size: 10px; font-weight: 700; }
    .nav-add {
      flex: 1; display: flex; align-items: center;
      justify-content: center; border: none; background: none; cursor: pointer; padding: 8px;
    }
    .add-c {
      width: 46px; height: 46px;
      background: var(--green); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: white; margin-top: -16px;
      box-shadow: 0 4px 18px rgba(61,107,82,.4);
    }

    /* ── 카드 ─────────────────────────────── */
    .card {
      background: var(--white); border-radius: 16px;
      border: 1px solid var(--border); padding: 18px; margin-bottom: 12px;
    }
    .sp { padding: 16px; }

    /* ── 폼 ──────────────────────────────── */
    .fg { margin-bottom: 13px; }
    .fg label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    .fg input, .fg textarea, .fg select {
      width: 100%; padding: 11px 13px;
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-family: inherit; color: var(--text);
      outline: none; transition: border-color .15s; background: var(--white);
    }
    .fg input:focus, .fg textarea:focus, .fg select:focus { border-color: var(--accent); }
    .fg textarea { resize: vertical; min-height: 80px; line-height: 1.7; }

    /* ── 버튼 ─────────────────────────────── */
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-green { background: var(--green); color: white; }
    .btn-ghost { background: white; color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 7px 13px; font-size: 12px; width: auto; border-radius: 8px; }

    /* ── 태그 ─────────────────────────────── */
    .tag-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: 2px solid var(--border);
      background: var(--bg); color: var(--muted); transition: all .15s; font-family: inherit;
    }
    .tag.sel { color: white; border-color: transparent; }
    .tag.sel.tb { background: var(--t-bang); }
    .tag.sel.tq { background: var(--t-q); }
    .tag.sel.tqt { background: var(--t-quote); }
    .tag.sel.ta { background: var(--t-apply); }
    .pill {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: white;
    }
    .pb { background: var(--t-bang); }
    .pq { background: var(--t-q); }
    .pqt { background: var(--t-quote); }
    .pa { background: var(--t-apply); }

    /* ── D-day 카드 ───────────────────────── */
    .dday-card {
      background: var(--green); color: white;
      border-radius: 16px; padding: 20px;
      margin-bottom: 12px; position: relative; overflow: hidden;
    }
    .dday-dino { position: absolute; right: 16px; bottom: 0; font-size: 52px; opacity: .25; }
    .dday-label { font-size: 12px; opacity: .75; margin-bottom: 4px; }
    .dday-num { font-family: 'Noto Serif KR', serif; font-size: 44px; font-weight: 700; line-height: 1; }
    .dday-date { font-size: 13px; opacity: .8; margin-top: 6px; }

    /* ── 책 카드 ──────────────────────────── */
    .book-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 12px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .book-cover {
      width: 68px; height: 96px; object-fit: cover;
      border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0;
      background: var(--bg);
    }
    .book-cover-ph {
      width: 68px; height: 96px; border-radius: 6px;
      border: 1px solid var(--border); flex-shrink: 0;
      background: var(--bg); display: flex; align-items: center;
      justify-content: center; font-size: 28px;
    }
    .book-title { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
    .book-author { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .book-meta { font-size: 12px; color: var(--muted); }

    /* ── 한마디 ───────────────────────────── */
    .oneliner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .oneliner-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
    }
    .ol-name { font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 5px; }
    .ol-text { font-size: 12px; color: var(--text); line-height: 1.65; }
    .ol-empty { font-size: 11px; color: var(--muted); font-style: italic; }

    /* ── 구절 카드 ────────────────────────── */
    .sc {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 12px;
    }
    .sc-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar {
      width: 34px; height: 34px; background: var(--green);
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: white; font-size: 13px;
      font-weight: 700; flex-shrink: 0;
    }
    .sc-name { font-size: 13px; font-weight: 700; color: var(--green); }
    .sc-date { font-size: 11px; color: var(--muted); }
    .sc-sent {
      font-family: 'Noto Serif KR', serif; font-size: 15px;
      line-height: 1.85; color: var(--text);
      border-left: 3px solid var(--accent);
      padding-left: 13px; margin-bottom: 8px;
    }
    .sc-pg { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .sc-ft { display: flex; align-items: center; justify-content: space-between; }
    .cmt-btn {
      background: none; border: none; font-size: 12px;
      color: var(--muted); cursor: pointer; font-family: inherit;
    }

    /* ── 레퍼런스 ─────────────────────────── */
    .ref-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; padding: 15px 16px; margin-bottom: 10px;
      display: flex; gap: 12px; align-items: flex-start;
      text-decoration: none; color: inherit;
    }
    .ref-type { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
    .ref-title { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 3px; }
    .ref-meta { font-size: 11px; color: var(--muted); }

    /* ── 아카이브 ─────────────────────────── */
    .arch-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; padding: 15px 16px; margin-bottom: 10px;
      display: flex; gap: 12px; align-items: center;
    }
    .arch-month {
      background: var(--green); color: white;
      border-radius: 8px; padding: 6px 10px;
      font-size: 12px; font-weight: 700; text-align: center;
      flex-shrink: 0; min-width: 48px;
    }

    /* ── 모달 (바텀시트) ──────────────────── */
    .ov {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .ov.on { display: flex; }
    .msheet {
      background: var(--white); border-radius: 20px 20px 0 0;
      padding: 20px; width: 100%; max-width: 480px;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .mhandle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .mtitle { font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 700; color: var(--green); margin-bottom: 16px; }

    /* ── 댓글 ─────────────────────────────── */
    .cmt-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .cmt-item:last-child { border-bottom: none; }
    .cmt-author { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 3px; }
    .cmt-text { font-size: 13px; line-height: 1.6; }
    .cmt-irow { display: flex; gap: 8px; margin-top: 12px; }
    .cmt-irow input {
      flex: 1; padding: 10px 13px;
      border: 1px solid var(--border); border-radius: 24px;
      font-size: 14px; font-family: inherit; outline: none;
    }
    .cmt-irow input:focus { border-color: var(--accent); }
    .cmt-send {
      background: var(--green); color: white; border: none;
      border-radius: 50%; width: 40px; height: 40px;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
    }

    /* ── 기타 ─────────────────────────────── */
    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .ei { font-size: 40px; margin-bottom: 12px; }
    .alert { padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .ae { background: #fee2e2; color: #991b1b; }
    .ao { background: #dcfce7; color: #166534; }
    .spin {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: white;
      border-radius: 50%; animation: rot .6s linear infinite; vertical-align: middle; margin-right: 4px;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    .section-label { font-size: 13px; font-weight: 700; color: var(--green); margin: 4px 0 10px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
  </style>
</head>
<body>

<!-- ══════ 앱 ══════ -->
<div id="appWrap">

  <!-- ── 홈 ── -->
  <div class="screen on" id="scHome">
    <div class="topbar">
      <div class="topbar-title">🦕 공룡 에이트</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="openOv('meetingOv')">📅 모임 설정</button>
        <button class="btn btn-ghost btn-sm" onclick="openOv('bookOv')">📖 책 설정</button>
      </div>
    </div>
    <div class="sp">
      <!-- D-day -->
      <div class="dday-card" id="ddayCard">
        <div class="dday-dino">🦕</div>
        <div class="dday-label">다음 모임까지</div>
        <div class="dday-num" id="ddayNum">-</div>
        <div class="dday-date" id="ddayDate">모임 날짜를 설정해주세요</div>
      </div>

      <!-- 이달의 책 -->
      <div class="section-label">📚 이달의 책</div>
      <div id="bookArea">
        <div class="card" style="text-align:center;color:var(--muted);font-size:14px;padding:24px">
          🦕 책을 설정해주세요
        </div>
      </div>

      <!-- 이달의 한마디 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="section-label" style="margin:0">💬 이달의 한마디</div>
        <button class="btn btn-ghost btn-sm" onclick="openOnelineModal()">+ 한마디 남기기</button>
      </div>
      <div class="oneliner-grid" id="onelineGrid"></div>
    </div>
  </div>

  <!-- ── 구절 ── -->
  <div class="screen" id="scSent">
    <div class="topbar"><div class="topbar-title">💬 구절 나누기</div></div>
    <div class="sp" id="sentList">
      <div class="empty"><div class="ei">🦕</div>아직 공유된 구절이 없어요</div>
    </div>
  </div>

  <!-- ── 레퍼런스 ── -->
  <div class="screen" id="scRef">
    <div class="topbar"><div class="topbar-title">📎 레퍼런스</div></div>
    <div class="sp" id="refList">
      <div class="empty"><div class="ei">📎</div>아직 레퍼런스가 없어요</div>
    </div>
  </div>

  <!-- ── 아카이브 ── -->
  <div class="screen" id="scArch">
    <div class="topbar"><div class="topbar-title">📚 아카이브</div></div>
    <div class="sp" id="archList">
      <div class="empty"><div class="ei">📚</div>아직 아카이브가 없어요</div>
    </div>
  </div>

  <!-- 하단 네비 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-sc="Home" onclick="goTab('Home')">
      <span class="ni">🏠</span><span class="nl">홈</span>
    </button>
    <button class="nav-item" data-sc="Sent" onclick="goTab('Sent')">
      <span class="ni">💬</span><span class="nl">구절</span>
    </button>
    <button class="nav-add" onclick="openFAB()">
      <div class="add-c">🦕</div>
    </button>
    <button class="nav-item" data-sc="Ref" onclick="goTab('Ref')">
      <span class="ni">📎</span><span class="nl">레퍼런스</span>
    </button>
    <button class="nav-item" data-sc="Arch" onclick="goTab('Arch')">
      <span class="ni">📚</span><span class="nl">아카이브</span>
    </button>
  </nav>
</div>

<!-- ══════ 모달: 책 설정 ══════ -->
<div class="ov" id="bookOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📖 이달의 책 설정</div>
    <div id="bookAlert"></div>
    <div class="fg"><label>제목 *</label><input id="bkTitle" type="text" placeholder="책 제목"/></div>
    <div class="fg"><label>저자</label><input id="bkAuthor" type="text" placeholder="저자명"/></div>
    <div class="fg"><label>출판사</label><input id="bkPub" type="text" placeholder="출판사"/></div>
    <div class="fg"><label>정가</label><input id="bkPrice" type="text" placeholder="예: 17,000원"/></div>
    <div class="fg"><label>표지 URL</label><input id="bkCover" type="url" placeholder="https://..."/></div>
    <div class="fg"><label>책 소개</label><textarea id="bkIntro" placeholder="짧은 소개" rows="3"></textarea></div>
    <div class="fg"><label>책 정보 링크</label><input id="bkLink" type="url" placeholder="https://..."/></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOv('bookOv')">취소</button>
      <button class="btn btn-green" id="bookSaveBtn" onclick="saveBook()">저장</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: 모임 설정 ══════ -->
<div class="ov" id="meetingOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📅 다음 모임 설정</div>
    <div id="meetingAlert"></div>
    <div class="fg"><label>모임 날짜</label><input id="mtDate" type="date"/></div>
    <div class="fg"><label>장소 (선택)</label><input id="mtLoc" type="text" placeholder="장소 입력"/></div>
    <div class="fg"><label>메모 (선택)</label><input id="mtNote" type="text" placeholder="메모"/></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOv('meetingOv')">취소</button>
      <button class="btn btn-green" id="meetingSaveBtn" onclick="saveMeeting()">저장</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: 한마디 ══════ -->
<div class="ov" id="onelineOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">💬 이달의 한마디</div>
    <div id="olAlert"></div>
    <div class="fg"><label>이름</label>
      <select id="olName"><option value="">이름 선택</option></select></div>
    <div class="fg"><label>한마디</label>
      <textarea id="olText" placeholder="이번 달 책에 대한 한마디를 남겨주세요" rows="3"></textarea></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOv('onelineOv')">취소</button>
      <button class="btn btn-green" id="olBtn" onclick="submitOneline()">등록</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: 구절 올리기 ══════ -->
<div class="ov" id="sentOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">🦕 구절 올리기</div>
    <div id="sentAlert"></div>
    <div class="fg"><label>이름</label>
      <select id="stName"><option value="">이름 선택</option></select></div>
    <div class="fg"><label>구절</label>
      <textarea id="stText" placeholder="마음에 걸린 문장을 적어주세요" rows="4"></textarea></div>
    <div class="fg"><label>페이지</label>
      <input type="number" id="stPage" placeholder="예: 47"/></div>
    <div class="fg">
      <label>태그 (복수 선택 가능)</label>
      <div class="tag-row" style="margin-top:6px">
        <button class="tag tb" data-t="!" onclick="toggleTag(this)">❗ 느낌표</button>
        <button class="tag tq" data-t="?" onclick="toggleTag(this)">❓ 물음표</button>
        <button class="tag tqt" data-t='"' onclick="toggleTag(this)">💬 인용</button>
        <button class="tag ta" data-t="@" onclick="toggleTag(this)">✨ 적용</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOv('sentOv')">취소</button>
      <button class="btn btn-green" id="sentBtn" onclick="submitSent()">올리기</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: 레퍼런스 ══════ -->
<div class="ov" id="refOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">📎 레퍼런스 추가</div>
    <div id="refAlert"></div>
    <div class="fg"><label>이름</label>
      <select id="rfName"><option value="">이름 선택</option></select></div>
    <div class="fg"><label>제목</label>
      <input id="rfTitle" type="text" placeholder="제목 입력"/></div>
    <div class="fg"><label>URL</label>
      <input id="rfUrl" type="url" placeholder="https://..."/></div>
    <div class="fg"><label>종류</label>
      <select id="rfType">
        <option value="유튜브🎬">유튜브 🎬</option>
        <option value="기사📰">기사 📰</option>
        <option value="블로그✍️">블로그 ✍️</option>
        <option value="기타🔗">기타 🔗</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOv('refOv')">취소</button>
      <button class="btn btn-green" id="refBtn" onclick="submitRef()">추가</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: FAB 선택 ══════ -->
<div class="ov" id="fabOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">무엇을 올릴까요? 🦕</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-green" onclick="closeOv('fabOv');openOv('sentOv')">💬 구절 올리기</button>
      <button class="btn btn-ghost" onclick="closeOv('fabOv');openOv('refOv')">📎 레퍼런스 추가</button>
      <button class="btn btn-ghost" onclick="closeOv('fabOv')">취소</button>
    </div>
  </div>
</div>

<!-- ══════ 모달: 댓글 ══════ -->
<div class="ov" id="cmtOv">
  <div class="msheet">
    <div class="mhandle"></div>
    <div id="cmtPrev" style="font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.85;color:var(--text);border-left:3px solid var(--accent);padding-left:13px;margin-bottom:16px"></div>
    <div class="card" style="padding:4px 16px;margin-bottom:0">
      <div id="cmtList"></div>
    </div>
    <div class="cmt-irow">
      <input type="text" id="cmtInput" placeholder="댓글 입력 (이름: 내용)"
        onkeydown="if(event.key==='Enter')submitCmt()"/>
      <button class="cmt-send" onclick="submitCmt()">↑</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;text-align:center">예: 박용희: 저도 이 부분이 좋았어요!</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  ⚙️ 설정
// ══════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbzsHOZi_glahWBrBH8g71Gpj9EVgTEEjQlpSrK4P6Psc6RZ-nerB0dw_kPWLmQP5QC6/exec'; // ← Apps Script URL 입력

const MEMBERS = ['박용희','강지혜','김양우','남우현','서수정','이정은','최별님','Ellory Park'];

// ══════════════════════════════════════════
//  상태
// ══════════════════════════════════════════
let selTags = [], curSentId = null, curTab = 'Home';

// ══════════════════════════════════════════
//  초기화
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  fillSelects();
  await loadHome();
});

function fillSelects() {
  ['olName','stName','rfName'].forEach(id => {
    const sel = q(`#${id}`);
    MEMBERS.forEach(m => { sel.innerHTML += `<option value="${m}">${m}</option>`; });
  });
}

// ══════════════════════════════════════════
//  API
// ══════════════════════════════════════════
async function GET(action, p = {}) {
  const url = new URL(API);
  url.searchParams.set('action', action);
  Object.entries(p).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url.toString(), { redirect:'follow' });
  return r.json();
}
async function POST(data) {
  const r = await fetch(API, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(data)
  });
  return r.json();
}

// ══════════════════════════════════════════
//  탭 이동
// ══════════════════════════════════════════
async function goTab(tab) {
  curTab = tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  q(`#sc${tab}`).classList.add('on');
  const btn = document.querySelector(`[data-sc="${tab}"]`);
  if (btn) btn.classList.add('active');
  if (tab==='Home')  await loadHome();
  if (tab==='Sent')  await loadSentences();
  if (tab==='Ref')   await loadRefs();
  if (tab==='Arch')  await loadArchive();
}

// ══════════════════════════════════════════
//  홈
// ══════════════════════════════════════════
async function loadHome() {
  await Promise.all([loadMeeting(), loadBook(), loadOneliners()]);
}

async function loadMeeting() {
  const r = await GET('getMeeting');
  if (r.success && r.meeting) {
    const m = r.meeting;
    const today = new Date(); today.setHours(0,0,0,0);
    const meet  = new Date(m.date); meet.setHours(0,0,0,0);
    const diff  = Math.round((meet - today) / 86400000);
    const card  = q('#ddayCard');
    if (diff > 0) {
      q('#ddayNum').textContent = 'D-' + diff;
    } else if (diff === 0) {
      q('#ddayNum').textContent = 'D-DAY 🎉';
      card.style.background = '#e67e22';
    } else {
      q('#ddayNum').textContent = '모임 완료';
    }
    q('#ddayDate').textContent = `${m.date}${m.location?' · '+m.location:''}${m.note?' · '+m.note:''}`;
    q('#mtDate').value = m.date;
    q('#mtLoc').value  = m.location || '';
    q('#mtNote').value = m.note || '';
  }
}

async function loadBook() {
  const r = await GET('getBook');
  const el = q('#bookArea');
  if (r.success && r.book) {
    const b = r.book;
    q('#bkTitle').value  = b.title || '';
    q('#bkAuthor').value = b.author || '';
    q('#bkPub').value    = b.publisher || '';
    q('#bkPrice').value  = b.price || '';
    q('#bkCover').value  = b.coverUrl || '';
    q('#bkIntro').value  = b.intro || '';
    q('#bkLink').value   = b.link || '';
    el.innerHTML = `
      <div class="book-card">
        ${b.coverUrl
          ? `<img class="book-cover" src="${b.coverUrl}" alt="표지" onerror="this.style.display='none'">`
          : `<div class="book-cover-ph">🦕</div>`}
        <div style="flex:1">
          <div class="book-title">${b.title}</div>
          <div class="book-author">${b.author||''} ${b.publisher?'· '+b.publisher:''}</div>
          <div class="book-meta">${b.price||''}</div>
          ${b.intro?`<div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6">${esc(b.intro)}</div>`:''}
          ${b.link?`<a href="${b.link}" target="_blank" style="font-size:12px;color:var(--accent);display:inline-block;margin-top:6px">책 정보 더보기 →</a>`:''}
        </div>
      </div>`;
  }
}

async function loadOneliners() {
  const r = await GET('getOneliners', { month: thisMonth() });
  const el = q('#onelineGrid');
  const map = {};
  if (r.success) r.oneliners.forEach(o => { map[o.memberName] = o.comment; });
  el.innerHTML = MEMBERS.map(m => `
    <div class="oneliner-card">
      <div class="ol-name">${m}</div>
      ${map[m]
        ? `<div class="ol-text">${esc(map[m])}</div>`
        : `<div class="ol-empty">아직 한마디 없음</div>`}
    </div>`).join('');
}

// ══════════════════════════════════════════
//  구절
// ══════════════════════════════════════════
async function loadSentences() {
  const r = await GET('getSentences', { month: thisMonth() });
  const el = q('#sentList');
  if (!r.success || !r.sentences.length) {
    el.innerHTML = `<div class="empty"><div class="ei">🦕</div>아직 공유된 구절이 없어요<br><small style="font-size:12px;margin-top:6px;display:block">🦕 버튼으로 첫 구절을 올려보세요!</small></div>`;
    return;
  }
  el.innerHTML = r.sentences.map(s => {
    const tags = (s.tags||'').split(',').filter(Boolean).map(t=>tagPill(t)).join('');
    return `<div class="sc">
      <div class="sc-hd">
        <div class="avatar">${s.memberName[0]}</div>
        <div>
          <div class="sc-name">${s.memberName}</div>
          <div class="sc-date">${fmtD(s.date)}</div>
        </div>
      </div>
      <div class="sc-sent">${esc(s.sentence)}</div>
      ${s.page?`<div class="sc-pg">p. ${s.page}</div>`:''}
      <div class="sc-ft">
        <div style="display:flex;gap:5px;flex-wrap:wrap">${tags}</div>
        <button class="cmt-btn" onclick="openCmt('${s.sentenceId}','${escA(s.sentence)}')">
          💬 ${s.commentCount>0?s.commentCount+'개':'댓글'}
        </button>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  레퍼런스
// ══════════════════════════════════════════
async function loadRefs() {
  const r = await GET('getRefs', { month: thisMonth() });
  const el = q('#refList');
  if (!r.success || !r.refs.length) {
    el.innerHTML = `<div class="empty"><div class="ei">📎</div>아직 레퍼런스가 없어요</div>`;
    return;
  }
  const typeIcon = { '유튜브🎬':'🎬', '기사📰':'📰', '블로그✍️':'✍️', '기타🔗':'🔗' };
  el.innerHTML = r.refs.map(rf => `
    <a class="ref-card" href="${rf.url}" target="_blank" rel="noopener">
      <div class="ref-type">${typeIcon[rf.type]||'🔗'}</div>
      <div>
        <div class="ref-title">${rf.title}</div>
        <div class="ref-meta">${rf.memberName} · ${fmtD(rf.date)}</div>
      </div>
    </a>`).join('');
}

// ══════════════════════════════════════════
//  아카이브
// ══════════════════════════════════════════
async function loadArchive() {
  const r = await GET('getArchive');
  const el = q('#archList');
  if (!r.success || !r.books.length) {
    el.innerHTML = `<div class="empty"><div class="ei">📚</div>아직 아카이브가 없어요</div>`;
    return;
  }
  el.innerHTML = r.books.map(b => `
    <div class="arch-card">
      ${b.coverUrl
        ? `<img src="${b.coverUrl}" style="width:44px;height:62px;object-fit:cover;border-radius:5px;border:1px solid var(--border);flex-shrink:0" onerror="this.style.display='none'">`
        : `<div style="width:44px;height:62px;border-radius:5px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">🦕</div>`}
      <div>
        <div class="arch-month">${b.month}</div>
        <div style="font-size:14px;font-weight:700;color:var(--green);margin-top:4px">${b.title}</div>
        <div style="font-size:12px;color:var(--muted)">${b.author||''}</div>
      </div>
    </div>`).join('');
}

// ══════════════════════════════════════════
//  저장 액션들
// ══════════════════════════════════════════
async function saveMeeting() {
  const date = q('#mtDate').value;
  if (!date) { flash('meetingAlert','날짜를 선택해주세요.','e'); return; }
  setLoad('meetingSaveBtn', true, '저장 중...');
  try {
    const r = await POST({ action:'saveMeeting', month:thisMonth(),
      date, location:q('#mtLoc').value.trim(), note:q('#mtNote').value.trim() });
    if (r.success) { closeOv('meetingOv'); await loadMeeting(); }
    else flash('meetingAlert', r.message, 'e');
  } catch { flash('meetingAlert','오류 발생.','e'); }
  finally { setLoad('meetingSaveBtn', false, '저장'); }
}

async function saveBook() {
  const title = q('#bkTitle').value.trim();
  if (!title) { flash('bookAlert','제목을 입력해주세요.','e'); return; }
  setLoad('bookSaveBtn', true, '저장 중...');
  try {
    const r = await POST({ action:'saveBook', month:thisMonth(),
      title, author:q('#bkAuthor').value.trim(), publisher:q('#bkPub').value.trim(),
      price:q('#bkPrice').value.trim(), coverUrl:q('#bkCover').value.trim(),
      intro:q('#bkIntro').value.trim(), link:q('#bkLink').value.trim() });
    if (r.success) { closeOv('bookOv'); await loadBook(); }
    else flash('bookAlert', r.message, 'e');
  } catch { flash('bookAlert','오류 발생.','e'); }
  finally { setLoad('bookSaveBtn', false, '저장'); }
}

function openOnelineModal() { q('#olText').value=''; q('#olAlert').innerHTML=''; openOv('onelineOv'); }
async function submitOneline() {
  const name=q('#olName').value, text=q('#olText').value.trim();
  if (!name||!text) { flash('olAlert','이름과 한마디를 입력해주세요.','e'); return; }
  setLoad('olBtn',true,'등록 중...');
  try {
    const r=await POST({ action:'addOneliner', memberName:name, comment:text, month:thisMonth(), date:todayStr() });
    if (r.success) { closeOv('onelineOv'); await loadOneliners(); }
    else flash('olAlert',r.message,'e');
  } catch { flash('olAlert','오류 발생.','e'); }
  finally { setLoad('olBtn',false,'등록'); }
}

function openFAB() { openOv('fabOv'); }

async function submitSent() {
  const name=q('#stName').value, txt=q('#stText').value.trim();
  if (!name||!txt) { flash('sentAlert','이름과 구절을 입력해주세요.','e'); return; }
  setLoad('sentBtn',true,'올리는 중...');
  try {
    const r=await POST({ action:'addSentence', memberName:name, sentence:txt,
      page:q('#stPage').value.trim(), tags:selTags.join(','),
      month:thisMonth(), date:todayStr() });
    if (r.success) { closeOv('sentOv'); selTags=[]; document.querySelectorAll('.tag').forEach(t=>t.classList.remove('sel')); await loadSentences(); goTab('Sent'); }
    else flash('sentAlert',r.message,'e');
  } catch { flash('sentAlert','오류 발생.','e'); }
  finally { setLoad('sentBtn',false,'올리기'); }
}

async function submitRef() {
  const name=q('#rfName').value, title=q('#rfTitle').value.trim(), url=q('#rfUrl').value.trim();
  if (!name||!title||!url) { flash('refAlert','모든 필드를 입력해주세요.','e'); return; }
  setLoad('refBtn',true,'추가 중...');
  try {
    const r=await POST({ action:'addRef', memberName:name, title, url,
      type:q('#rfType').value, month:thisMonth(), date:todayStr() });
    if (r.success) { closeOv('refOv'); await loadRefs(); goTab('Ref'); }
    else flash('refAlert',r.message,'e');
  } catch { flash('refAlert','오류 발생.','e'); }
  finally { setLoad('refBtn',false,'추가'); }
}

// ══════════════════════════════════════════
//  댓글
// ══════════════════════════════════════════
async function openCmt(sentenceId, sentText) {
  curSentId=sentenceId;
  q('#cmtPrev').textContent=sentText;
  q('#cmtInput').value='';
  q('#cmtList').innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">불러오는 중...</div>';
  openOv('cmtOv');
  await loadCmts(sentenceId);
}
async function loadCmts(sid) {
  const r=await GET('getComments',{sentenceId:sid});
  const el=q('#cmtList');
  if (!r.success||!r.comments.length) { el.innerHTML='<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">첫 댓글을 남겨보세요!</div>'; return; }
  el.innerHTML=r.comments.map(c=>`
    <div class="cmt-item">
      <div class="cmt-author">${c.memberName}</div>
      <div class="cmt-text">${esc(c.comment)}</div>
    </div>`).join('');
}
async function submitCmt() {
  const raw=q('#cmtInput').value.trim();
  if (!raw) return;
  const colonIdx=raw.indexOf(':');
  let name='익명', text=raw;
  if (colonIdx>0) { name=raw.slice(0,colonIdx).trim(); text=raw.slice(colonIdx+1).trim(); }
  const r=await POST({ action:'addComment', sentenceId:curSentId, memberName:name, comment:text, date:todayStr() });
  if (r.success) { q('#cmtInput').value=''; await loadCmts(curSentId); }
}

// ══════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════
const q=sel=>document.querySelector(sel);
const todayStr=()=>new Date().toLocaleDateString('sv-SE');
const thisMonth=()=>new Date().toLocaleDateString('sv-SE').slice(0,7);
const fmtD=s=>s?s.slice(5).replace('-','/'):'';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const escA=s=>String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;').slice(0,60);

function tagPill(t) {
  const m={'!':['pb','❗'],'?':['pq','❓'],'"':['pqt','💬'],'@':['pa','✨']};
  const [cls,icon]=m[t]||['',''];
  return `<span class="pill ${cls}">${icon}</span>`;
}
function toggleTag(btn) {
  const t=btn.dataset.t;
  if(selTags.includes(t)){selTags=selTags.filter(x=>x!==t);btn.classList.remove('sel');}
  else{selTags.push(t);btn.classList.add('sel');}
}
function flash(id,msg,type) {
  const el=q(`#${id}`);
  el.innerHTML=`<div class="alert ${type==='e'?'ae':'ao'}">${msg}</div>`;
  if(type!=='o') setTimeout(()=>{el.innerHTML='';},5000);
}
function setLoad(id,on,txt) {
  const b=q(`#${id}`); b.disabled=on;
  if(txt) b.innerHTML=on?`<span class="spin"></span>${txt}`:txt;
}
function openOv(id)  { q(`#${id}`).classList.add('on'); }
function closeOv(id) { q(`#${id}`).classList.remove('on'); }
document.querySelectorAll('.ov').forEach(ov=>{
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.classList.remove('on'); });
});
</script>
</body>
</html>
